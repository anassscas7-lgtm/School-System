server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send all API requests to the backend service
    location /api/ {
        proxy_pass https://system-backend.school-system.knoxverse.com;

        proxy_ssl_server_name on;
        proxy_ssl_name system-backend.school-system.knoxverse.com;

        proxy_set_header Host system-backend.school-system.knoxverse.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
